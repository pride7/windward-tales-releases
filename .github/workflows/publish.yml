name: Publish downloads
on:
  push:
    branches: [main]
    paths: [latest.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-downloads
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create download release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(jq -r '.version' latest.json)
          # x.y.z 是安装包，x.y.z-otaN 是它之上的第 N 次热更新，两者都要发布：
          # 热更新没有新 APK，但仍然把同一个 APK 按新版本名放进 Release，SHA256SUMS.txt 里也是这样列的。
          # 早先这里只认 x.y.z，每次热更新都在这一步 exit 1，包其实已经发出去了却留下一个失败记录。
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-ota[0-9]+)?$ ]] || exit 1
          mkdir -p upload
          cp "bundles/windward-tales-$VERSION.zip" upload/
          cp windward-tales.apk "upload/windward-tales-$VERSION.apk"
          cp SHA256SUMS.txt latest.json upload/
          (cd upload && sha256sum --check SHA256SUMS.txt)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            test "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" = true
          else
            gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "风行物语 $VERSION" --notes "安卓安装包与游戏热更新包。下载 APK 安装；已安装的正式版会自动检查兼容的游戏更新。"
          fi
          gh release upload "v$VERSION" upload/* --clobber
          gh release edit "v$VERSION" --draft=false --latest
